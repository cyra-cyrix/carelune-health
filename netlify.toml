# Carelune Neuro Continuum — demonstration prototype (fictional data).
#
# Static Vite build. Prepared for deployment; NOT yet deployed — no Netlify
# account is connected to this project (see the deployment blocker note in the
# session report). Nothing here contains secrets; do not add any.
#
# The app uses HASH routing (`#<role>[/sub]`), so every URL resolves to
# index.html on its own. No SPA rewrite rule is defined, and none should be
# added unless testing on the deployed site proves it is required.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Matches the toolchain this build was verified against.
  NODE_VERSION = "24"

# Static demo with no backend, no API, no forms and no analytics.
# Headers below are defence-in-depth only; they add no functionality.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # This build is a fictional demonstration and must never be indexed as a
    # real clinical service.
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
