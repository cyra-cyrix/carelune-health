<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#168BFF" />

    <!-- The authenticated application. It must never be indexed and carries no
         marketing metadata, no patient data in the title/URL, and no canonical
         pointing at the marketing site. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Secure Carelune workspace. Sign-in required." />
    <title>Carelune</title>

    <!-- White-label guard for the public patient registration/invite route.
         The title above is parsed before the (deferred) app module runs, so
         setting it from React alone would still show the platform name in the
         tab for a moment. A family opening an invite link must never see it, so
         the neutral title is applied here, during parse. RegisterPatient then
         replaces it with the institution's own name once the token resolves.
         Every other surface keeps the title above. -->
    <script>
      if (window.location.search.indexOf("register=") !== -1) {
        document.title = "Patient Registration";
      }
    </script>

    <link rel="icon" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Installable PWA (application build only; the marketing build ships neither
         this manifest nor the service worker). -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Self-hosted fonts (no Google Fonts). Preload the primary UI face. -->
    <link rel="preload" href="/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
