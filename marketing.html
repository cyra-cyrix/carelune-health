<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta
      name="description"
      content="Carelune gives hospitals, rehabilitation centres and specialists a structured way to guide recovery at home — clinician-approved plans turned into daily caregiver actions, coordinator-led communication and a clear attention queue for your clinical team."
    />
    <title>Carelune — Continuity of care after discharge, for institutions</title>

    <!-- Public marketing site: indexable, with a canonical on the marketing origin. -->
    <link rel="canonical" href="https://carelune.in/" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Carelune" />
    <meta property="og:title" content="Your patients leave the hospital. Your care should continue." />
    <meta
      property="og:description"
      content="A structured way for hospitals, rehabilitation centres and specialists to guide recovery at home — clinician-controlled plans, coordinator-led communication and a clear attention queue for your clinical team."
    />
    <meta property="og:url" content="https://carelune.in/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Your patients leave the hospital. Your care should continue." />
    <meta
      name="twitter:description"
      content="Continuity of care after discharge — for hospitals, rehabilitation centres and specialists."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M28 16a12 12 0 1 1-6-10.4' fill='none' stroke='%232A6FC7' stroke-width='3.4' stroke-linecap='round'/%3E%3Ccircle cx='27' cy='7.5' r='3.2' fill='%232A6FC7'/%3E%3C/svg%3E"
    />
    <!-- Self-hosted fonts (no Google Fonts). Preload only the primary above-the-fold
         face — Manrope drives the landing headline/LCP. -->
    <link rel="preload" href="/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>

    <!-- Static, Netlify-detectable enquiry form. Netlify scans built HTML at
         deploy time, so the React SPA form is invisible to it; this hidden form
         declares the `carelune-enquiry` form, its honeypot and every field name
         (union of both visitor routes). The React form submits a same-origin
         url-encoded POST that Netlify matches to this declaration. No patient
         fields are collected. -->
    <form name="carelune-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="carelune-enquiry" />
      <input name="bot-field" />
      <input name="route" />
      <input name="consent" />
      <input name="name" />
      <input name="email" />
      <input name="mobile" />
      <input name="city" />
      <input name="volume" />
      <textarea name="purpose"></textarea>
      <input name="mrn" />
      <input name="speciality" />
      <input name="org" />
      <input name="role" />
    </form>

    <script type="module" src="/src/marketing.tsx"></script>
  </body>
</html>
