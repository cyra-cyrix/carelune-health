# Carelune Neuro Continuum — demonstration prototype (fictional data).
#
# Static Vite build. Prepared for deployment; NOT yet deployed — no Netlify
# account is connected to this project (see the deployment blocker note in the
# session report). Nothing here contains secrets; do not add any.
#
# The app is a single-page Vite build. It uses hash routing (`#<role>[/sub]`)
# INSIDE the app, plus two real paths: "/" (public landing) and "/login" (auth).
# The SPA fallback below rewrites every non-asset path to index.html (200) so a
# direct load of /login works; `?register=<token>` on "/" is unaffected.

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — serve index.html for any route that isn't a real file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # Matches the toolchain this build was verified against.
  NODE_VERSION = "24"

# Static demo with no backend, no API, no forms and no analytics.
# Headers below are defence-in-depth only; they add no functionality.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # This build is a fictional demonstration and must never be indexed as a
    # real clinical service.
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
